worker_processes  1;

events {
    worker_connections 1024;
}

http {
    map_hash_bucket_size 64;

    resolver 1.1.1.1 valid=300s;

    map $host $upstream_host {
        api.thehunter.com         127.0.0.1:82;
        apiv2.thehunter.com       127.0.0.1:82;
        gameserver.thehunter.com  127.0.0.1:5000;
        map.thehunter.com         static-hr.crecraftstudios.com;
        static.thehunter.com      static-hr.crecraftstudios.com;
        www.thehunter.com         hunterreborn.crecraftstudios.com;
        default                   "";
    }

    server {
        listen 80;

        server_name 
            api.thehunter.com
            apiv2.thehunter.com
            gameserver.thehunter.com
            map.thehunter.com
            static.thehunter.com
            www.thehunter.com;

        #location ^~ /v1/json/hunter_gameclient {
        #    proxy_pass https://gameserver-hr.crecraftstudios.com;
        #    proxy_set_header Host gameserver-hr.crecraftstudios.com;

        #    proxy_ssl_server_name on;
        #    proxy_ssl_name gameserver-hr.crecraftstudios.com;
        #}

        #location ^~ /auth/jwt/refresh {
        #    proxy_pass http://127.0.0.1:82;
        #    proxy_set_header Host 127.0.0.1:82;
        #}

        location / {
            if ($upstream_host = "") {
                return 444;
            }

            proxy_pass https://$upstream_host$request_uri;

            proxy_set_header Host $upstream_host;
            proxy_ssl_server_name on;
            proxy_ssl_name $upstream_host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 443 ssl;

        server_name
            api.thehunter.com
            apiv2.thehunter.com
            gameserver.thehunter.com
            map.thehunter.com
            static.thehunter.com
            www.thehunter.com;

        ssl_certificate     "../ssl/thehunter.com.crt";
        ssl_certificate_key "../ssl/thehunter.com.key";

       ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

		ssl_ciphers ALL:@SECLEVEL=0;

        #location ^~ /v1/json/hunter_gameclient {
        #    proxy_pass https://gameserver-hr.crecraftstudios.com;
        #    proxy_set_header Host gameserver-hr.crecraftstudios.com;

         #   proxy_ssl_server_name on;
         #   proxy_ssl_name gameserver-hr.crecraftstudios.com;
        #}

        #location ^~ /auth/jwt/refresh {
        #    proxy_pass http://127.0.0.1:82;
        #    proxy_set_header Host 127.0.0.1:82;
        #}

        location / {
            if ($upstream_host = "") {
                return 444;
            }

            proxy_pass https://$upstream_host$request_uri;

            proxy_set_header Host $upstream_host;
            proxy_ssl_server_name on;
            proxy_ssl_name $upstream_host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}